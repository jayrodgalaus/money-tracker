<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c55">
  <meta name="description" content="A simple, private, offline-first money tracker.">
  <title>Money Tracker</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <div class="container app-container topbar-inner">
        <a class="brand" href="#/dashboard" aria-label="Money Tracker home"><span class="brand-mark" aria-hidden="true">₱</span><span><strong>Money Tracker</strong><small>Know where your money goes</small></span></a>
        <a class="topbar-settings" href="#/settings" aria-label="Open settings">Settings <span aria-hidden="true">⚙</span></a>
      </div>
    </header>
    <main id="view" class="container app-container page-content" tabindex="-1" aria-live="polite">
      <noscript>Enable JavaScript to access your money tracker.</noscript>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="container app-container nav-inner">
        <a href="#/dashboard" data-tab="dashboard"><span class="nav-symbol" aria-hidden="true">⌂</span><span>Home</span></a>
        <a href="#/cash-in" data-tab="cash-in"><span class="nav-symbol" aria-hidden="true">＋</span><span>Cash in</span></a>
        <a href="#/cash-out" data-tab="cash-out"><span class="nav-symbol" aria-hidden="true">−</span><span>Cash out</span></a>
        <a href="#/settings" data-tab="settings"><span class="nav-symbol" aria-hidden="true">⚙</span><span>Settings</span></a>
      </div>
    </nav>
    <div id="message" class="status-message" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
